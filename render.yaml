services:
  - type: web
    name: evaldam
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: NPM_FLAGS
        value: --legacy-peer-deps
